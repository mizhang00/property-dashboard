<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房产管理仪表板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Hiragino Sans", "PingFang SC", sans-serif; background: #f0f2f5; color: #222; min-height: 100vh; }
header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 17px; font-weight: 600; }
header .sub { font-size: 11px; opacity: 0.5; margin-left: auto; }
.view { display: none; padding: 20px; max-width: 960px; margin: 0 auto; }
.view.active { display: block; }
.breadcrumb { font-size: 13px; color: #888; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.breadcrumb a { color: #4f8ef7; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span { color: #ccc; }
.loading { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #4f8ef7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.buildings { display: flex; gap: 16px; flex-wrap: wrap; }
.building-card { flex: 1; min-width: 220px; background: white; border-radius: 14px; padding: 22px 20px; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-top: 4px solid; }
.building-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
.building-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.building-card .addr { font-size: 11px; color: #888; margin-bottom: 14px; line-height: 1.5; }
.building-card .stats { display: flex; gap: 16px; flex-wrap: wrap; }
.stat .num { font-size: 22px; font-weight: 700; line-height: 1; }
.stat .lbl { font-size: 11px; color: #888; margin-top: 2px; }
.floor-label { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 8px; }
.rooms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.room-card { background: white; border-radius: 10px; padding: 14px; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border-top: 3px solid; position: relative; min-height: 105px; }
.room-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.12); transform: translateY(-1px); }
.s-occupied  { border-top-color: #34a853; }
.s-scheduled { border-top-color: #a142f4; }
.s-reviewing { border-top-color: #4f8ef7; }
.s-renting   { border-top-color: #fbbc04; }
.room-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.room-num { font-size: 20px; font-weight: 800; }
.room-status { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
.s-occupied  .room-status { background: #e6f4ea; color: #137333; }
.s-scheduled .room-status { background: #f3e8fd; color: #7b1fa2; }
.s-reviewing .room-status { background: #e8f0fe; color: #1a73e8; }
.s-renting   .room-status { background: #fef7e0; color: #b45309; }
.room-info { font-size: 11.5px; line-height: 1.7; }
.ri-label { color: #aaa; font-size: 10.5px; }
.ri-value { color: #333; font-weight: 500; }
.room-arrow { position: absolute; right: 10px; bottom: 10px; color: #ddd; font-size: 13px; }
.cond-tag { display: inline-block; margin-top: 6px; font-size: 10px; font-weight: 600; color: #1a73e8; background: #e8f0fe; padding: 2px 7px; border-radius: 4px; }
.room-detail { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
.detail-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid #f0f2f5; }
.detail-num { font-size: 40px; font-weight: 800; line-height: 1; }
.detail-meta h3 { font-size: 15px; font-weight: 600; }
.detail-meta p { font-size: 12px; color: #888; margin-top: 4px; }
.detail-status { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-top: 6px; }
.section { margin-bottom: 20px; }
.section h4 { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; }
.cond-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.cond-item { background: #f7f8fc; border-radius: 8px; padding: 10px 12px; }
.cond-item .cl { font-size: 10.5px; color: #888; margin-bottom: 2px; }
.cond-item .cv { font-size: 13px; font-weight: 700; }
.notes-box { background: #f7f8fc; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.7; color: #444; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #666; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
@media (max-width: 500px) { .buildings { flex-direction: column; } .rooms-grid { gap: 8px; } }
</style>
</head>
<body>
<header>
  <svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="white" stroke-width="1.8" fill="none"/><path d="M9 21V12h6v9" stroke="white" stroke-width="1.8"/></svg>
  <h1>房产管理仪表板</h1>
  <span class="sub" id="last-updated">加载中...</span>
</header>

<div id="view-buildings" class="view active">
  <div class="loading"><div class="spinner"></div>正在读取数据...</div>
</div>

<div id="view-building" class="view">
  <div class="breadcrumb"><a onclick="showBuildings()">全部房产</a><span>›</span><span id="bc-building"></span></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#34a853"></div>出租中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a142f4"></div>预定入住</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4f8ef7"></div>申请审查中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbc04"></div>在招租</div>
  </div>
  <div id="building-rooms"></div>
</div>

<div id="view-room" class="view">
  <div class="breadcrumb">
    <a onclick="showBuildings()">全部房产</a><span>›</span>
    <a onclick="showCurrentBuilding()" id="bc-building2"></a><span>›</span>
    <span id="bc-room"></span>
  </div>
  <div id="room-detail"></div>
</div>

<script>
const SHEET_ID = '1ywzO3JanM6Qc_A3_XGLEPO_7BoHpQhDiso9FG6ZS3mA';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=Sheet1';

const BUILDINGS_META = {
  '六本木':        { color:'#1a73e8', addr:'ザ・レジデンス六本木　港区', icon:'🏢' },
  '足立区（公园）': { color:'#137333', addr:"b'CASA おおさかえ公園　足立区西竹の塚1丁目7-11", icon:'🏘️' },
  '小平市（一桥）': { color:'#7b1fa2', addr:'ジーメゾン小平ウエスト　東京都小平市', icon:'🏘️' },
};

const STATUS_CLASS = { '出租中':'s-occupied','预定入住':'s-scheduled','申请审查中':'s-reviewing','招租中':'s-renting','在招租':'s-renting' };
const STATUS_COLOR = {
  '出租中':    {bg:'#e6f4ea',fg:'#137333'},
  '预定入住':  {bg:'#f3e8fd',fg:'#7b1fa2'},
  '申请审查中':{bg:'#e8f0fe',fg:'#1a73e8'},
  '招租中':    {bg:'#fef7e0',fg:'#b45309'},
  '在招租':    {bg:'#fef7e0',fg:'#b45309'},
};

let allRooms = [];
let currentBuilding = '';

async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const cols = json.table.cols.map(c => c.label);
    allRooms = json.table.rows.map(r => {
      const obj = {};
      cols.forEach((col,i) => { obj[col] = r.c[i] ? (r.c[i].v !== null ? String(r.c[i].v) : '') : ''; });
      return obj;
    });
    document.getElementById('last-updated').textContent = '更新：' + new Date().toLocaleDateString('zh-CN');
    renderBuildings();
  } catch(e) {
    document.getElementById('view-buildings').innerHTML = '<div class="loading">数据加载失败，请刷新重试</div>';
  }
}

function renderBuildings() {
  const buildings = [...new Set(allRooms.map(r => r.building))];
  let html = '<div class="buildings">';
  buildings.forEach(b => {
    const meta = BUILDINGS_META[b] || {color:'#888',addr:'',icon:'🏠'};
    const rooms = allRooms.filter(r => r.building === b);
    const occupied = rooms.filter(r => r.status === '出租中').length;
    const active   = rooms.filter(r => ['申请审查中','预定入住'].includes(r.status)).length;
    const renting  = rooms.filter(r => ['招租中','在招租'].includes(r.status)).length;
    html += `<div class="building-card" style="border-top-color:${meta.color}" onclick="showBuilding('${b}')">
      <div style="font-size:28px;margin-bottom:10px">${meta.icon}</div>
      <h2>${b}</h2><div class="addr">${meta.addr}</div>
      <div class="stats">
        <div class="stat"><div class="num" style="color:${meta.color}">${rooms.length}</div><div class="lbl">总房间</div></div>
        <div class="stat"><div class="num" style="color:#34a853">${occupied}</div><div class="lbl">出租中</div></div>
        ${active  ? `<div class="stat"><div class="num" style="color:#4f8ef7">${active}</div><div class="lbl">申请中</div></div>` : ''}
        ${renting ? `<div class="stat"><div class="num" style="color:#fbbc04">${renting}</div><div class="lbl">招租中</div></div>` : ''}
      </div></div>`;
  });
  html += '</div>';
  document.getElementById('view-buildings').innerHTML = html;
}

function showBuildings() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-buildings').classList.add('active');
}

function showBuilding(b) {
  currentBuilding = b;
  document.getElementById('bc-building').textContent = b;
  document.getElementById('bc-building2').textContent = b;
  const rooms = allRooms.filter(r => r.building === b);
  const floors = [...new Set(rooms.map(r => String(r.room)[0]))].sort();
  let html = '';
  floors.forEach(f => {
    const fr = rooms.filter(r => String(r.room).startsWith(f));
    html += `<div class="floor-label">${f}F</div><div class="rooms-grid">`;
    fr.forEach(r => {
      const sc = STATUS_CLASS[r.status] || 's-renting';
      const hasCond = r.rent || r.mgmt_fee || r.deposit || r.cleaning_fee || r.ad_fee;
      html += `<div class="room-card ${sc}" onclick="showRoom('${r.building}','${r.room}')">
        <div class="room-header"><span class="room-num">${r.room}</span><span class="room-status">${r.status}</span></div>
        <div class="room-info">
          <div><span class="ri-label">租客 </span><span class="ri-value">${r.tenant||'—'}</span></div>
          <div><span class="ri-label">契约 </span><span class="ri-value">${r.contract_start||'—'}</span></div>
        </div>
        ${hasCond ? '<div class="cond-tag">📋 有招租条件</div>' : ''}
        <div class="room-arrow">›</div></div>`;
    });
    html += '</div>';
  });
  document.getElementById('building-rooms').innerHTML = html;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-building').classList.add('active');
}

function showCurrentBuilding() { showBuilding(currentBuilding); }

function showRoom(building, room) {
  const r = allRooms.find(x => x.building === building && x.room === room);
  if (!r) return;
  document.getElementById('bc-room').textContent = room + '号';
  const sc = STATUS_COLOR[r.status] || {bg:'#f1f3f4',fg:'#555'};
  const meta = BUILDINGS_META[building] || {color:'#888'};
  const hasCond = r.rent || r.mgmt_fee || r.deposit || r.cleaning_fee || r.ad_fee;
  let condHTML = '';
  if (hasCond) {
    condHTML = `<div class="section"><h4>招租条件</h4><div class="cond-grid">
      ${r.rent         ? `<div class="cond-item"><div class="cl">月租金</div><div class="cv">${r.rent} 円</div></div>` : ''}
      ${r.mgmt_fee     ? `<div class="cond-item"><div class="cl">管理费</div><div class="cv">${r.mgmt_fee} 円</div></div>` : ''}
      ${r.deposit      ? `<div class="cond-item"><div class="cl">押金</div><div class="cv">${r.deposit}</div></div>` : ''}
      ${r.cleaning_fee ? `<div class="cond-item"><div class="cl">清掃費</div><div class="cv">${r.cleaning_fee} 円</div></div>` : ''}
      ${r.ad_fee       ? `<div class="cond-item"><div class="cl">广告费 AD</div><div class="cv">${r.ad_fee}</div></div>` : ''}
    </div></div>`;
  }
  document.getElementById('room-detail').innerHTML = `
    <div class="room-detail">
      <div class="detail-header">
        <div class="detail-num" style="color:${meta.color}">${room}</div>
        <div class="detail-meta">
          <h3>${building}</h3>
          <p>${r.tenant||'—'}</p>
          <span class="detail-status" style="background:${sc.bg};color:${sc.fg}">${r.status}</span>
          ${r.contract_start ? `<p style="margin-top:6px;font-size:11px;color:#aaa">契约开始：${r.contract_start}</p>` : ''}
        </div>
      </div>
      ${condHTML}
      ${r.notes ? `<div class="section"><h4>备注</h4><div class="notes-box">${r.notes}</div></div>` : ''}
    </div>`;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-room').classList.add('active');
}

loadData();
</script>
</body>
</html>
